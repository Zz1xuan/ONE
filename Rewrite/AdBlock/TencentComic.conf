# 腾讯动漫

# 开屏远程配置：直接返回空字典，避免仅隐藏图片后仍停留在开屏容器
^https:\/\/rdelivery\.qq\.com\/v3\/config\/pull$ url reject-dict

# 开屏素材兜底：仅拦截 operation 目录下使用 Sharp 格式的 JPG 运营素材
# 避开漫画封面（vertical）、头像（manhua_head）以及 PNG/GIF/AVIF 素材
^https:\/\/manhua\.acimg\.cn\/operation\/0\/[^/?]+\.jpg\/0\?tp=sharp(?:&.*)?$ url reject-img

hostname = rdelivery.qq.com, manhua.acimg.cn
