# 晓晓优选 · 全广告过滤（业务改写 + 广告填充请求拦截）
# 奖励视频亦会被拦截，看广告领收益可能不可用；不伪造奖励或任务完成。
# SDK 填充规则是 URL 级：部分共享接口也可能影响其他 App 的广告。
# 保留登录、订单、支付、商品导航和活动任务数据，不封共享 CDN 或统计域名。

# 业务广告开关、推广展示位与程序化广告资源
^https:\/\/xxyx-client-api\.xiaoxiaoyouxuan\.com\/(?:place_ad|public_config|get_ad_config)(?:\?|$) url script-response-body https://raw.githubusercontent.com/Zz1xuan/ONE/main/Script/AD/XiaoXiaoYouXuan.js

# 本应用 TopOn 配置含多种广告适配器：关闭所有广告位，无需依赖响应脚本读取请求体
^https:\/\/(?:apiv4|api)\.anythinktech\.com\/v2\/open\/placement(?:\?|$) url reject

# 本应用直客广告填充（HAR 明确返回素材、落地页及展示/点击回报）
^https?:\/\/ad\.shunchangzhixing\.com\/getAd\/298963(?:\?|$) url reject
# 旧抓包中上游 channelUrlList 指向的备用广告源（不拦 init2）
^https?:\/\/inner\.baihemob\.com\/ad2(?:\?|$) url reject

# 聚合与 SDK 广告填充：不拦配置、日志、点击回报和普通图片
^https:\/\/xadsmartget\.adgain\.cn\/sdk\/ad_get(?:\?|$) url reject
^https:\/\/bid\.adbiding\.com\/bid(?:\?|$) url reject
^https:\/\/sdk\.adx\.adwangmai\.com\/sdk\/(?:ad\.api|media\/request\.api|thrid\/request\.api)(?:\?|$) url reject
^https:\/\/adservice\.sigmob\.cn\/ad\/v4(?:\?|$) url reject

# 旧抓包中同应用的其他广告填充分支，防止切换备用 SDK 后漏拦
^https:\/\/api-access\.pangolin-sdk-toutiao-b\.com\/api\/ad\/union\/sdk\/get_ads\/(?:\?|$) url reject
^https:\/\/open\.e\.kuaishou\.com\/rest\/e\/v3\/open\/univ(?:\?|$) url reject
^https?:\/\/sdk\.1rtb\.net\/sdk\/req_ad(?:\?|$) url reject
^https:\/\/sdk\.zhangyuyidong\.cn\/api\/zysdk(?:\?|$) url reject

hostname = inner.baihemob.com, xxyx-client-api.xiaoxiaoyouxuan.com, apiv4.anythinktech.com, api.anythinktech.com, ad.shunchangzhixing.com, xadsmartget.adgain.cn, bid.adbiding.com, sdk.adx.adwangmai.com, adservice.sigmob.cn, api-access.pangolin-sdk-toutiao-b.com, open.e.kuaishou.com, sdk.1rtb.net, sdk.zhangyuyidong.cn
