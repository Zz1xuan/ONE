function routeDependency(scope){const m={'/2/profile/me':'profileMe','/2/groups/allgroups/v2':'tabs','/2/flowpage':'flowpage','/2/search/finder':'search','/2/search/hot_word':'search','/2/statuses/container_detail':'detail','/2/statuses/container_timeline_hot':'hotTimeline','/2/push/active':'pushActive','/2/client/publisher_list':'publisher','/2/messageflow/notice':'notice','/2/direct_messages/user_list':'directMessages'};return m[scope]||''}

function changed(){dirty=true;msg('有未保存的修改');if(loaded)refreshSwitches();updateDependencies();lock()}
function row(key,description,scope,custom=false,detail=''){const semantic=semanticFor(key,custom);const label=document.createElement('label');label.className='row';label.dataset.search=(description+' '+key).toLowerCase();const text=document.createElement('span'),input=document.createElement('input');text.textContent=description.replace(/ · 开启[＝=].*$/,'');input.type='checkbox';input.dataset.k=key;input.dataset.custom=String(custom);if(semantic.automatic)input.dataset.automatic='true';input.disabled=true;input.setAttribute('role','switch');input.setAttribute('aria-label',text.textContent);input.onchange=()=>{if(custom&&key==='showProfileTaskServices')activate('moduleVisible');if(custom&&['fineProfile','fineTabs','fineMenus'].includes(key)&&input.checked)initializeFine(key);changed()};label.append(text,input);annotate(label,semantic,key==='showProfileTaskServices'||key==='hideProfileGridIcons'?semantic.location:semantic.category==='compatibility'?'兼容行为，非屏蔽开关；具体位置待确认':semantic.category==='route'?'父级处理：控制整页响应内原清理流程':custom&&semantic.sourceKind!=='explicit'?'兼容项：具体位置待确认':'');if(semantic.automatic)label.hidden=true;editorBox(scope,key,(!custom&&!['enabled','injectSettingsEntry'].includes(key))||(custom&&!CUSTOM_FIELDS.find(f=>f.key===key&&f.kind==='explicit'))||key.startsWith('fine')).append(label)}
for(const k of Object.keys(LEGACY_DEFAULTS))row(k,legacyLabel(k),'legacy');
for(const f of CUSTOM_FIELDS)row(f.key,friendlyField(f),f.scope,true,fieldDependency(f)+' 字段：'+f.target+'；证据：'+f.evidence);
// Fixed template editors: switches show effective legacy state until the first edit.
const typedControls=[],typedGroups=new Map();let typedState={};
const typedTitles={noticeMenuVisible:'消息反馈菜单',publisherVisible:'发布入口',moduleVisible:'页面模块',gridVisible:'快捷网格',tabVisible:'首页顶部导航',subtabVisible:'默认子分组',menuVisible:'详情操作菜单',negativeVisible:'启动反馈操作',menuLabels:'菜单状态文字',noticeMenuLabels:'消息反馈文字'};
function modeFor(k){return /^(module|grid)/.test(k)?'fineProfile':/^(tab|subtab)/.test(k)?'fineTabs':k.startsWith('menu')?'fineMenus':''}
function legacyVisible(k,id,c){const x=c.custom;if(!c.enabled||(/^(module|grid)/.test(k)&&!c.profileMe)||(/^(tab|subtab)/.test(k)&&!c.tabs)||(k==='menuVisible'&&!c.detail))return true;if(k==='moduleVisible')return ['profileme_mine','100505_-_top8','100505_-_chaohua','100505_-_manage'].includes(id)||!!x.retain__2_profile_me_595;if(k==='gridVisible')return ['100505_-_like','100505_-_watchhistory','100505_-_draft','100505_-_pay'].includes(id)||!!x.preserve__2_profile_me_562;if(k==='subtabVisible')return true;if(k==='menuVisible')return Object.prototype.hasOwnProperty.call(c,'menu_'+id)?c['menu_'+id]:true;return true;}
function effectiveVisible(k,id){const mode=modeFor(k),c=draftConfig();if(mode&&!c.custom[mode])return legacyVisible(k,id,c);return Object.prototype.hasOwnProperty.call(typedState[k]||{},id)?typedState[k][id]:true;}
function initializeFine(mode){const c=draftConfig();if(typedState['__'+mode])return;for(const [k,s]of Object.entries(TYPED_SCHEMA))if(s.type==='boolMap'&&modeFor(k)===mode){const map={};for(const id of s.ids)map[id]=typedState[k]?.[id]===false?false:legacyVisible(k,id,c);typedState[k]=map;}typedState['__'+mode]=true;for(const x of widgets())if(x.dataset.k===mode)x.checked=true;}
function activate(k){const mode=modeFor(k);if(mode){const x=document.querySelector('[data-k="'+mode+'"]');if(x&&!x.checked)initializeFine(mode);if(x)x.checked=true;}}
function setTyped(k,id,value){activate(k);if(id===null)typedState[k]=value;else{if(!typedState[k])typedState[k]={};if(value==='')delete typedState[k][id];else typedState[k][id]=value;}changed();refreshSwitches();}
function refreshSwitches(){for(const c of typedControls)if(c.type==='boolMap')c.element.checked=!effectiveVisible(c.key,c.id);}
function groupKeys(key){const prefix=key.replace(/Visible$/,'');return {order:prefix+'Order',labels:prefix+'Labels'};}
for(const [key,schema]of Object.entries(TYPED_SCHEMA)){
 if(schema.type!=='boolMap')continue;
 const box=document.createElement('details'),title=document.createElement('summary');box.className='typed-box';box.dataset.typedGroup=key;title.textContent=typedTitles[key]+(LOCATIONS[key]?' · '+LOCATIONS[key]:'');box.append(title);editorBox('',key).append(box);box.open=/^(module|grid)Visible$/.test(key);
 if(key==='moduleVisible'){const p=document.createElement('p');p.textContent='开启=屏蔽；关闭=保留。资料与更多功能受保护。活动名称随服务端变化；仅处理实际返回模块，未知模块保留。';box.append(p);}
 const {order,labels}=groupKeys(key),canOrder=!!TYPED_SCHEMA[order],canLabel=!!TYPED_SCHEMA[labels];
 const edit=document.createElement('button');edit.textContent='编辑排序 / 名称';edit.className='edit-toggle';edit.dataset.editControl='true';edit.onclick=()=>{const on=box.dataset.editing!=='true';box.dataset.editing=String(on);edit.textContent=on?'完成编辑':'编辑排序 / 名称';box.querySelectorAll('.editing').forEach(x=>x.hidden=!on);};if(canOrder||canLabel)box.append(edit);
 for(const id of schema.ids){
  const row=document.createElement('label');row.className='row';row.dataset.id=id;row.dataset.search=(templateName(id)+' '+typedTitles[key]).toLowerCase();const name=document.createElement('span');name.textContent=templateName(id);const input=document.createElement('input');input.type='checkbox';input.dataset.typed=key;input.setAttribute('role','switch');input.setAttribute('aria-label',name.textContent);input.onchange=()=>setTyped(key,id,!input.checked);if((schema.required||[]).includes(id)){input.dataset.protected='true';input.title='必要入口受保护';}row.append(name,input);const meta=SEMANTICS['typed.'+key+'.'+id];if(key==='moduleVisible'&&id==='100505_-_renwu')meta.location='我 → 独立任务中心卡片';annotate(row,meta,id==='100505_-_renwu'?meta.location:'');box.append(row);typedControls.push({key,id,type:'boolMap',element:input});
  const editing=document.createElement('div');editing.className='editing';editing.hidden=true;editing.dataset.for=id;
  if(canOrder)for(const [step,text]of [[-1,'上移'],[1,'下移']]){const b=document.createElement('button');b.textContent=text;b.setAttribute('aria-label',templateName(id)+text);b.dataset.editControl='true';b.onclick=()=>{const ids=[...box.querySelectorAll('.row')].map(r=>r.dataset.id),i=ids.indexOf(id),j=i+step;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];setTyped(order,null,ids);reorderBox(key);};editing.append(b);}
  if(canLabel&&TYPED_SCHEMA[labels].ids.includes(id)){const t=document.createElement('input');t.type='text';t.maxLength=48;t.placeholder='原名称：'+templateName(id);t.setAttribute('aria-label','改名 '+templateName(id));t.dataset.typed=labels;t.oninput=()=>setTyped(labels,id,t.value.trim());editing.append(t);typedControls.push({key:labels,id,type:'labels',element:t});}
  if(editing.childNodes.length)box.append(editing);
 }
 if(key==='moduleVisible'){const parent=box.parentElement;parent.insertBefore(box,parent.children[1]||null);}else if(key==='gridVisible'){const parent=box.parentElement;parent.insertBefore(box,parent.children[2]||null);}typedGroups.set(key,box);
}
// State-specific text slots not represented by the parent menu row remain available on demand.
for(const key of ['menuLabels','noticeMenuLabels']){const schema=TYPED_SCHEMA[key],box=document.createElement('details'),title=document.createElement('summary');box.className='typed-box';title.textContent=typedTitles[key]+(LOCATIONS[key]?' · '+LOCATIONS[key]:'');box.append(title);editorBox('',key).append(box);for(const id of schema.ids){if(typedControls.some(c=>c.key===key&&c.id===id))continue;const row=document.createElement('label'),span=document.createElement('span'),t=document.createElement('input');row.className='row';span.textContent=templateName(id);row.dataset.search=span.textContent.toLowerCase();t.type='text';t.maxLength=48;t.dataset.typed=key;t.placeholder='保留原名称';t.setAttribute('aria-label',span.textContent);t.oninput=()=>setTyped(key,id,t.value.trim());row.append(span,t);annotate(row,{location:LOCATIONS[key.replace('Labels','Visible')]||'菜单 → 状态文字',scope:key,operation:'仅修改名称，不改变屏蔽状态',category:'label'});box.append(row);typedControls.push({key,id,type:'labels',element:t});}}
function reorderBox(k){const box=typedGroups.get(k),{order}=groupKeys(k),ids=TYPED_SCHEMA[k].ids,ranks=new Map((typedState[order]||[]).map((id,i)=>[id,i]));for(const id of [...ids].sort((a,b)=>(ranks.get(a)??999)-(ranks.get(b)??999))){const row=[...box.querySelectorAll('.row')].find(r=>r.dataset.id===id);const edit=[...box.querySelectorAll('.editing')].find(r=>r.dataset.for===id);box.append(row);if(edit)box.append(edit);}}
function drawTyped(){typedState=JSON.parse(JSON.stringify(cfg.custom));for(const mode of ['fineProfile','fineTabs','fineMenus'])typedState['__'+mode]=!!cfg.custom[mode];refreshSwitches();for(const c of typedControls)if(c.type==='labels')c.element.value=typedState[c.key]?.[c.id]||'';for(const k of typedGroups.keys())reorderBox(k);}
function collectTyped(next){for(const k of Object.keys(TYPED_SCHEMA))next.custom[k]=JSON.parse(JSON.stringify(typedState[k]??cfg.custom[k]));validateConfig(next);return next;}

const help=document.createElement('details'),helpTitle=document.createElement('summary'),helpText=document.createElement('p');helpTitle.textContent='关于与帮助';helpText.textContent='修改模块会自动切换定制模式；保存后重新进入对应页面。“用户任务与服务”控制用户任务、微博购、短剧与稀缺装扮整卡；屏蔽开关默认开启，修复此前遗漏显示，不影响独立的任务中心开关。仅控制响应实际返回的项目，不补造模块；未知动态模块保留。静态拦截规则不受设置控制。图标隐藏不解锁会员权益。测试版尚未微博真机验收；技术信息见README。';help.append(helpTitle,helpText);$('#list').append(help);
function validateFull(c){validateConfig(c);if(Object.keys(c).length!==68||Object.keys(LEGACY_DEFAULTS).some(k=>typeof c[k]!=='boolean')||!plain(c.custom)||Object.keys(c.custom).length!==Object.keys(CUSTOM_DEFAULTS).length)throw Error('配置结构不完整，拒绝覆盖');return c}
function draw(){widgets().forEach(x=>x.checked=toChecked(x.dataset.k,x.dataset.custom==='true'?cfg.custom[x.dataset.k]:cfg[x.dataset.k],x.dataset.custom==='true'));drawTyped();updateDependencies()}
async function request(options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(api,{...options,cache:'no-store',credentials:'omit',signal:controller.signal});let j;try{j=JSON.parse(await r.text())}catch(_){throw Error('响应不是JSON，请检查config重写')}if(!r.ok||!j.ok||j.schemaVersion!==3)throw Error(j.error||'服务版本不匹配');return validateFull(j.config)}finally{clearTimeout(timer)}}
async function load(){if(dirty&&!confirm('放弃未保存修改？'))return;busy=true;lock();try{cfg=await request();loaded=true;dirty=false;draw();msg('已读取')}catch(e){loaded=false;msg('读取失败：'+e.message,true)}finally{busy=false;lock()}}
async function save(next,text){try{validateFull(next);const bytes=byteLength(JSON.stringify(next));if(bytes>MAX_BYTES)throw Error('完整配置 '+bytes+' 字节，超过 32768 字节；请减少文字或排序项（尚未发送）')}catch(e){msg('不能保存：'+e.message,true);return}busy=true;lock();try{cfg=await request({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(next)});dirty=false;draw();msg(text)}catch(e){msg('保存失败：'+e.message+'；尚未确认生效',true)}finally{busy=false;lock()}}
$('#save').onclick=()=>{const next={custom:{}};for(const x of widgets())if(x.dataset.custom==='true')next.custom[x.dataset.k]=fromChecked(x.dataset.k,x.checked,true);else next[x.dataset.k]=fromChecked(x.dataset.k,x.checked);try{save(collectTyped(next),'已保存；请重新进入对应页面。'+dependencySummary(next))}catch(e){msg('输入无效：'+e.message,true)}};$('#load').onclick=load;$('#reset').onclick=()=>{if(confirm('恢复全部默认并保存？'))save(normalize({}),'已恢复默认')};$('#search').oninput=()=>{const q=$('#search').value.trim().toLowerCase();for(const [name,d]of purposeSections){let count=0;d.querySelectorAll('.row').forEach(r=>{r.hidden=r.querySelector('[data-automatic]')!==null||!!q&&!r.dataset.search.includes(q);if(!r.hidden)count++;const edit=r.nextElementSibling;if(edit&&edit.classList.contains('editing')&&r.hidden)edit.hidden=true;});d.hidden=count===0;if(q)d.open=count>0;for(const box of d.querySelectorAll('.typed-box')){box.hidden=![...box.querySelectorAll('.row')].some(r=>!r.hidden);if(q)box.open=!box.hidden}}};window.addEventListener('error',()=>msg('页面运行异常，请重新读取',true));lock();load();
