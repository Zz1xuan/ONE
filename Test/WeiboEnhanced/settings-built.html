function row(key,description,scope,custom=false,detail=''){const label=document.createElement('label');label.className='row';label.dataset.search=(key+' '+description+' '+scope).toLowerCase();const text=document.createElement('span'),strong=document.createElement('strong'),small=document.createElement('small'),input=document.createElement('input');strong.textContent=description;small.textContent=detail||('兼容原清理 · '+scope);small.title=key;text.append(strong,small);input.type='checkbox';input.dataset.k=key;input.dataset.custom=String(custom);input.disabled=true;input.setAttribute('aria-label',description);input.onchange=()=>{dirty=true;msg('有未保存的修改')};label.append(text,input);section(custom?scope:['enabled','injectSettingsEntry'].includes(key)?'基本设置':'旧67项兼容控制').append(label)}
for(const k of Object.keys(LEGACY_DEFAULTS))row(k,legacyLabel(k),'legacy');
for(const f of CUSTOM_FIELDS)row(f.key,friendlyField(f),f.kind==='explicit'?'常用：显示与精细模式':GROUP_NAMES[f.scope]||('接口 '+f.scope),true,fieldDependency(f)+' 字段：'+f.target+'；证据：'+f.evidence);
for(const [name,d]of sections)if(!['基本设置','常用：显示与精细模式'].includes(name)){d.open=false;advanced.append(d)};$('#list').insertBefore(section('常用：显示与精细模式'),advanced);section('常用：显示与精细模式').open=true;
const typedControls=[];const typedTitles={noticeMenuVisible:'消息：卡片反馈菜单显示',publisherVisible:'发布器：标准入口分组显示',moduleVisible:'我的：模块显示',moduleOrder:'我的：模块排序',moduleLabels:'我的：模块文字',gridVisible:'我的：网格显示',gridOrder:'我的：网格排序',gridLabels:'我的：网格文字',tabVisible:'首页：顶部导航显示',tabOrder:'首页：顶部导航排序',tabLabels:'首页：顶部导航文字',subtabVisible:'首页：默认子分组显示',subtabOrder:'首页：默认子分组排序',subtabLabels:'首页：默认子分组文字',menuVisible:'详情：操作菜单显示',menuOrder:'详情：操作菜单排序',menuLabels:'详情：各状态菜单文字',negativeVisible:'启动：反馈操作显示',negativeOrder:'启动：反馈操作排序'};
for(const [key,schema]of Object.entries(TYPED_SCHEMA)){
 const box=section(typedTitles[key]),note=document.createElement('p');note.textContent=key==='publisherVisible'?'按标准名称分组，同名变体共同隐藏；不是68项逐一编辑。':schema.type==='order'?'填写固定标识，每行一项；未填写项稳定追加，不会生成缺失项目。':schema.type==='labels'?'只改已确认文本槽；menuLabels 按状态 type 分别改名，不改动作或其它状态。':'继承/显示/隐藏；未知项目保留。需要开启相应 fine 模式。';box.append(note);
 if(schema.type==='order'){const row=document.createElement('div');row.className='row';row.dataset.search=key.toLowerCase();const textarea=document.createElement('textarea');textarea.rows=4;textarea.style.width='100%';textarea.dataset.typed=key;textarea.placeholder=schema.ids.join('\n');textarea.oninput=()=>{dirty=true;msg('有未保存修改')};textarea.disabled=true;row.append(textarea);box.append(row);typedControls.push({key,element:textarea,type:'order'});}
 else for(const id of schema.ids){const row=document.createElement('label');row.className='row';row.dataset.search=(key+' '+id).toLowerCase();const text=document.createElement('span');text.textContent=templateName(id);text.title=id;let input;if(schema.type==='boolMap'){input=document.createElement('select');for(const [v,l]of [['','继承'],['true','显示'],['false','隐藏']]){const o=document.createElement('option');o.value=v;o.textContent=l;input.append(o)}if((schema.required||[]).includes(id))input.lastChild.disabled=true;}else{input=document.createElement('input');input.type='text';input.maxLength=48;input.placeholder='继承原文字'}input.disabled=true;input.dataset.typed=key;input.onchange=()=>{dirty=true;msg('有未保存修改')};row.append(text,input);box.append(row);typedControls.push({key,id,element:input,type:schema.type});}
}
function drawTyped(){for(const c of typedControls){const value=cfg.custom[c.key];c.element.value=c.type==='order'?value.join('\n'):Object.prototype.hasOwnProperty.call(value,c.id)?String(value[c.id]):''}}
function collectTyped(next){for(const [k,s]of Object.entries(TYPED_SCHEMA))next.custom[k]=s.type==='order'?[]:{};for(const c of typedControls){const value=c.element.value.trim();if(c.type==='order')next.custom[c.key]=value?value.split(/\s+/):[];else if(value)next.custom[c.key][c.id]=c.type==='boolMap'?value==='true':value;}validateConfig(next);return next}

function validateFull(c){validateConfig(c);if(Object.keys(c).length!==68||Object.keys(LEGACY_DEFAULTS).some(k=>typeof c[k]!=='boolean')||!plain(c.custom)||Object.keys(c.custom).length!==Object.keys(CUSTOM_DEFAULTS).length)throw Error('配置结构不完整，拒绝覆盖');return c}
function draw(){widgets().forEach(x=>x.checked=x.dataset.custom==='true'?cfg.custom[x.dataset.k]:cfg[x.dataset.k]);drawTyped()}
async function request(options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(api,{...options,cache:'no-store',credentials:'omit',signal:controller.signal});let j;try{j=JSON.parse(await r.text())}catch(_){throw Error('响应不是JSON，请检查config重写')}if(!r.ok||!j.ok||j.schemaVersion!==3)throw Error(j.error||'服务版本不匹配');return validateFull(j.config)}finally{clearTimeout(timer)}}
async function load(){if(dirty&&!confirm('放弃未保存修改？'))return;busy=true;lock();try{cfg=await request();loaded=true;dirty=false;draw();msg('已连接 · '+(67+CUSTOM_FIELDS.length)+' 项布尔控制已读取')}catch(e){loaded=false;msg('读取失败：'+e.message,true)}finally{busy=false;lock()}}
async function save(next,text){try{validateFull(next);const bytes=byteLength(JSON.stringify(next));if(bytes>MAX_BYTES)throw Error('完整配置 '+bytes+' 字节，超过 32768 字节；请减少文字或排序项（尚未发送）')}catch(e){msg('不能保存：'+e.message,true);return}busy=true;lock();try{cfg=await request({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(next)});dirty=false;draw();msg(text)}catch(e){msg('保存失败：'+e.message+'；尚未确认生效',true)}finally{busy=false;lock()}}
$('#save').onclick=()=>{const next={custom:{}};for(const x of widgets())if(x.dataset.custom==='true')next.custom[x.dataset.k]=x.checked;else next[x.dataset.k]=x.checked;try{save(collectTyped(next),'已保存服务端确认的配置')}catch(e){msg('输入无效：'+e.message,true)}};$('#load').onclick=load;$('#reset').onclick=()=>{if(confirm('恢复全部默认并保存？'))save(normalize({}),'已恢复默认')};$('#search').oninput=()=>{const q=$('#search').value.trim().toLowerCase();for(const d of sections.values()){let count=0;d.querySelectorAll('.row').forEach(r=>{r.hidden=!r.dataset.search.includes(q);if(!r.hidden)count++});d.hidden=count===0;if(q)d.open=count>0}if(q)advanced.open=[...advanced.querySelectorAll('.row')].some(r=>!r.hidden)};window.addEventListener('error',()=>msg('页面运行异常，请重新读取',true));lock();load();
</script></body></html>
