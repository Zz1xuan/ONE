<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>微博增强设置 V2</title><style>body{font:15px -apple-system,sans-serif;background:#f5f6f7;margin:0;color:#222}main{max-width:640px;margin:auto;padding:16px}section{background:white;border-radius:12px;margin:12px 0;padding:12px}h1{font-size:21px}h2{font-size:16px;margin:4px 0 10px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border:0}small{color:#777}button{border:0;border-radius:8px;padding:10px 14px;margin:4px;background:#1677ff;color:white}button.secondary{background:#777}#status{padding:8px;color:#b33;white-space:pre-wrap}input{width:20px;height:20px}</style><main><h1>微博增强·细粒度设置 V2</h1><p><small>本地实验版；脚本开关不控制独立 DOMAIN/reject 规则。</small></p><div id="list"></div><button id="load">读取</button><button id="save">保存</button><button class="secondary" id="reset">恢复默认</button><div id="status"></div></main><script>
const api='https://api.weibo.cn/minis-enhanced-v2/config', groups=[['总控', ['enabled','injectSettingsEntry']],['共享清理辅助',['avatarCleanup','feedCleanup','voteCleanup']],['广告/首页接口',['sdkAd','cardlist','checkin','publisher','pushActive','comments','container','directMessages','flowlist','flowpage','tabs','notice','page']],['个人页/搜索',['profileTimeline','profileActions','profileMe','profileStatuses','userinfo','search','searchAll','chaohuaSearch']],['详情/信息流/视频',['detail','detailComment','hotTimeline','followingTimeline','topicTimeline','extend','repost','statusShow','videoFull','videoDetail','videoList','topicChannels','appicon','preload','cachedAds']],['详情菜单（按原菜单键）',['menu_creatortypeask','menu_mblog_menus_apeal','menu_mblog_menus_avatar_widget','menu_mblog_menus_bullet_shield','menu_mblog_menus_card_bg','menu_mblog_menus_comment_manager','menu_mblog_menus_copy_url','menu_mblog_menus_custom','menu_mblog_menus_delete','menu_mblog_menus_edit','menu_mblog_menus_edit_history','menu_mblog_menus_edit_video','menu_mblog_menus_favorite','menu_mblog_menus_follow','menu_mblog_menus_home','menu_mblog_menus_long_picture','menu_mblog_menus_modify_visible','menu_mblog_menus_novelty','menu_mblog_menus_open_reward','menu_mblog_menus_popularize','menu_mblog_menus_promote','menu_mblog_menus_report','menu_mblog_menus_shield','menu_mblog_menus_sticking','menu_mblog_menus_video_feedback','menu_mblog_menus_video_later']]];let cfg={};const list=document.querySelector('#list');for(const [title,keys] of groups){let s=document.createElement('section');s.innerHTML='<h2>'+title+'</h2>';for(const k of keys){let l=document.createElement('label');l.className='row';l.innerHTML='<span>'+k+'</span><input type="checkbox" data-k="'+k+'">';s.append(l)}list.append(s)}function msg(x,bad=false){let e=document.querySelector('#status');e.textContent=x;e.style.color=bad?'#b33':'#176b35'}function draw(){document.querySelectorAll('[data-k]').forEach(x=>x.checked=!!cfg[x.dataset.k])}async function load(){try{let r=await fetch(api,{cache:'no-store'});let j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||r.status);cfg=j.config;draw();msg('已读取')}catch(e){msg('读取失败：'+e.message,true)}}document.querySelector('#load').onclick=load;document.querySelector('#save').onclick=async()=>{let n={};document.querySelectorAll('[data-k]').forEach(x=>n[x.dataset.k]=x.checked);try{let r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(n)}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||r.status);cfg=j.config;draw();msg('已保存')}catch(e){msg('保存失败：'+e.message,true)}};document.querySelector('#reset').onclick=async()=>{if(!confirm('恢复全部默认设置？'))return;cfg={};document.querySelectorAll('[data-k]').forEach(x=>x.checked=false);for(const [_,ks] of groups)ks.forEach(k=>cfg[k]=true);for(const k of ['menu_creatortypeask','menu_mblog_menus_avatar_widget','menu_mblog_menus_card_bg','menu_mblog_menus_custom','menu_mblog_menus_home','menu_mblog_menus_novelty','menu_mblog_menus_open_reward','menu_mblog_menus_popularize','menu_mblog_menus_promote','menu_mblog_menus_video_feedback','menu_mblog_menus_video_later'])cfg[k]=false;try{let r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});let j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||r.status);cfg=j.config;draw();msg('已恢复默认')}catch(e){msg('恢复失败：'+e.message,true)}};load();
</script>
