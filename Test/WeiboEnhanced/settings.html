<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微博增强</title><style>
*{box-sizing:border-box}body{font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#f2f2f7;color:#202024;margin:0}main{max-width:760px;margin:auto;padding:20px 16px calc(104px + env(safe-area-inset-bottom))}h1{font-size:26px;margin:8px 0 18px}p,small{color:#666;line-height:1.45;font-size:12px}input[type=search]{width:100%;min-width:0;padding:12px;border:0;border-radius:10px;background:#e6e6eb;font-size:15px;margin-top:12px}details{background:white;margin:14px 0;border-radius:12px;padding:0 12px;min-width:0}summary{font-weight:600;cursor:pointer;padding:15px 0;min-width:0}.row{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #eee;min-height:54px;padding:8px 0;min-width:0}.row>span{flex:1 1 0;min-width:0;overflow-wrap:anywhere;font-weight:400}.row strong{font-weight:400}.row input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;flex:0 0 48px;width:48px;height:29px;border-radius:18px;background:#d2d2d7;border:0;margin:0;transition:background .15s}.row input[type=checkbox]:after{content:'';position:absolute;left:2px;top:2px;width:25px;height:25px;background:white;border-radius:50%;box-shadow:0 1px 3px #0003;transition:transform .15s}.row input[type=checkbox]:checked{background:#34c759}.row input[type=checkbox]:checked:after{transform:translateX(19px)}input:focus-visible,button:focus-visible{outline:2px solid #007aff;outline-offset:3px}.row input[type=text],.row select{min-width:0;width:48%;max-width:48%;padding:8px;border:1px solid #ddd;border-radius:7px;font:inherit}.row textarea{min-width:0;max-width:100%;font:inherit}.source-advanced{background:#f9f9fb}.typed-box{border:1px solid #eee}.editing{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-top:1px solid #eee;min-width:0}.editing input{min-width:0;flex:1 1 100%;width:100%;padding:9px;border:1px solid #ddd;border-radius:7px;font:inherit}.editing button{padding:8px 10px}.edit-toggle{display:block;padding:7px 10px;margin:8px 0 10px auto}h3{font-size:13px;color:#666;font-weight:500;margin:18px 0 6px}footer{position:fixed;bottom:0;left:0;right:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#fffffff5;border-top:1px solid #ddd;display:flex;gap:8px;justify-content:center}button{font:inherit;padding:11px 12px;border:0;border-radius:9px;color:#007aff;background:#f0f0f5}#save{background:#007aff;color:white}#status{font-size:13px;padding:12px;background:#fff;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}#dependency-help{font-size:12px;color:#975d00;background:#fff3d6;padding:10px;border-radius:9px;margin-top:10px}#dependency-help button{padding:6px;margin-top:6px}[data-bad=true]{color:#b22}button:disabled,input:disabled{opacity:.45}[hidden]{display:none!important}
</style></head><body><main><h1>微博增强</h1><div id="status" role="status">正在读取…</div><input id="search" type="search" placeholder="搜索可用模块与设置"><div id="dependency-help" hidden></div><div id="list"></div></main><footer><button id="load">重新读取</button><button id="reset" disabled>恢复默认</button><button id="save" disabled>保存设置</button></footer><script>
/*__COMMON__*/
const api='https://api.weibo.cn/minis-enhanced-v2/config';
let cfg={},loaded=false,busy=false,dirty=false;
const $=s=>document.querySelector(s),widgets=()=>[...document.querySelectorAll('[data-k]')];
function msg(s,bad=false){$('#status').textContent=s;$('#status').dataset.bad=String(bad)}
function lock(){widgets().forEach(x=>x.disabled=!loaded||busy);document.querySelectorAll('[data-typed]').forEach(x=>x.disabled=!loaded||busy||x.dataset.protected==='true');$('#save').disabled=!loaded||busy||!dirty;document.querySelectorAll('[data-edit-control]').forEach(x=>x.disabled=!loaded||busy);$('#reset').disabled=!loaded||busy;$('#load').disabled=busy}
const sections=new Map();function section(name){if(!sections.has(name)){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=name;d.append(s);$('#list').append(d);sections.set(name,d)}return sections.get(name)}
/*__UI_LABELS__*/
/*__UI_GROUPS__*/
function changed(){dirty=true;msg('有未保存的修改');if(loaded)refreshSwitches();updateDependencies();lock()}
function row(key,description,scope,custom=false,detail=''){const label=document.createElement('label');label.className='row';label.dataset.search=(description+' '+key).toLowerCase();const text=document.createElement('span'),input=document.createElement('input');text.textContent=description.replace(/ · 开启[＝=].*$/,'');input.type='checkbox';input.dataset.k=key;input.dataset.custom=String(custom);input.disabled=true;input.setAttribute('role','switch');input.setAttribute('aria-label',text.textContent);input.onchange=()=>{if(custom&&['fineProfile','fineTabs','fineMenus'].includes(key)&&input.checked)initializeFine(key);changed()};label.append(text,input);editorBox(scope,key,(!custom&&!['enabled','injectSettingsEntry'].includes(key))||(custom&&!CUSTOM_FIELDS.find(f=>f.key===key&&f.kind==='explicit'))||key.startsWith('fine')).append(label)}
for(const k of Object.keys(LEGACY_DEFAULTS))row(k,legacyLabel(k),'legacy');
for(const f of CUSTOM_FIELDS)row(f.key,friendlyField(f),f.scope,true,fieldDependency(f)+' 字段：'+f.target+'；证据：'+f.evidence);
/*__TYPED_UI__*/
const help=document.createElement('details'),helpTitle=document.createElement('summary'),helpText=document.createElement('p');helpTitle.textContent='关于与帮助';helpText.textContent='修改模块会自动切换定制模式；保存后重新进入对应页面。仅控制响应实际返回的项目，不补造模块；未知动态模块保留。静态拦截规则不受设置控制。图标隐藏不解锁会员权益。测试版尚未微博真机验收；技术信息见README。';help.append(helpTitle,helpText);$('#list').append(help);
function validateFull(c){validateConfig(c);if(Object.keys(c).length!==68||Object.keys(LEGACY_DEFAULTS).some(k=>typeof c[k]!=='boolean')||!plain(c.custom)||Object.keys(c.custom).length!==Object.keys(CUSTOM_DEFAULTS).length)throw Error('配置结构不完整，拒绝覆盖');return c}
function draw(){widgets().forEach(x=>x.checked=x.dataset.custom==='true'?cfg.custom[x.dataset.k]:cfg[x.dataset.k]);drawTyped();updateDependencies()}
async function request(options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(api,{...options,cache:'no-store',credentials:'omit',signal:controller.signal});let j;try{j=JSON.parse(await r.text())}catch(_){throw Error('响应不是JSON，请检查config重写')}if(!r.ok||!j.ok||j.schemaVersion!==3)throw Error(j.error||'服务版本不匹配');return validateFull(j.config)}finally{clearTimeout(timer)}}
async function load(){if(dirty&&!confirm('放弃未保存修改？'))return;busy=true;lock();try{cfg=await request();loaded=true;dirty=false;draw();msg('已读取')}catch(e){loaded=false;msg('读取失败：'+e.message,true)}finally{busy=false;lock()}}
async function save(next,text){try{validateFull(next);const bytes=byteLength(JSON.stringify(next));if(bytes>MAX_BYTES)throw Error('完整配置 '+bytes+' 字节，超过 32768 字节；请减少文字或排序项（尚未发送）')}catch(e){msg('不能保存：'+e.message,true);return}busy=true;lock();try{cfg=await request({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(next)});dirty=false;draw();msg(text)}catch(e){msg('保存失败：'+e.message+'；尚未确认生效',true)}finally{busy=false;lock()}}
$('#save').onclick=()=>{const next={custom:{}};for(const x of widgets())if(x.dataset.custom==='true')next.custom[x.dataset.k]=x.checked;else next[x.dataset.k]=x.checked;try{save(collectTyped(next),'已保存；请重新进入对应页面。'+dependencySummary(next))}catch(e){msg('输入无效：'+e.message,true)}};$('#load').onclick=load;$('#reset').onclick=()=>{if(confirm('恢复全部默认并保存？'))save(normalize({}),'已恢复默认')};$('#search').oninput=()=>{const q=$('#search').value.trim().toLowerCase();for(const [name,d]of purposeSections){let count=0;d.querySelectorAll('.row').forEach(r=>{r.hidden=!!q&&!r.dataset.search.includes(q);if(!r.hidden)count++;const edit=r.nextElementSibling;if(edit&&edit.classList.contains('editing')&&r.hidden)edit.hidden=true;});d.hidden=count===0;if(q)d.open=count>0;for(const box of d.querySelectorAll('.typed-box')){box.hidden=![...box.querySelectorAll('.row')].some(r=>!r.hidden);if(q)box.open=!box.hidden}}};window.addEventListener('error',()=>msg('页面运行异常，请重新读取',true));lock();load();
</script></body></html>
