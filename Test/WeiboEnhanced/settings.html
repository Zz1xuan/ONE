<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微博增强 V4 本地设置</title><style>body{font:15px -apple-system,sans-serif;background:#f3f3f7;color:#202024;margin:0}main{max-width:800px;margin:auto;padding:20px 16px 100px}h1{font-size:24px}p,small{color:#666;line-height:1.5}input[type=search]{box-sizing:border-box;width:100%;padding:14px;border:1px solid #ddd;border-radius:10px}details{background:white;margin:14px 0;border-radius:12px;padding:12px}summary{font-weight:600;cursor:pointer}.row{display:flex;align-items:center;gap:12px;border-top:1px solid #eee;padding:13px 0}.row span{flex:1;overflow-wrap:anywhere}.row small{display:block;font-size:11px}.row input[type=checkbox]{width:24px;height:24px;accent-color:#e87832}.row input[type=text],.row select{max-width:48%;padding:8px}.row[data-inactive=true] .dependency{color:#a65e13}.typed-box{border:1px solid #eee}.source-advanced{background:#f7f7fa}footer{position:fixed;bottom:0;left:0;right:0;padding:14px;background:white;display:flex;gap:12px;justify-content:center}button{padding:12px 18px;border:0;border-radius:10px}#save{background:#e87832;color:white}#status{padding:14px;background:#fff;border-radius:10px;white-space:pre-wrap}[data-bad=true]{color:#b22}button:disabled{opacity:.4}[hidden]{display:none!important}</style></head><body><main><h1>微博增强 V4</h1><p>本地候选 · 未经微博真机验证。旧接口开关控制是否执行处理；新增「保留」开关打开表示保留该字段或内容。路由和共享旧开关仍优先。</p><div id="status" role="status">正在启动…</div><p>新增细项来自源代码审计，未标 HAR 确认的项目不得视为已在当前客户端生效。独立 DOMAIN/reject 拦截不受这里控制。默认兼容原清理。请先开启对应精细模式，再在固定模板编辑区设置显示、排序或文字；状态菜单文字按状态分别修改。</p><input id="search" type="search" placeholder="统一搜索：功能、模板、配置键"><div id="list"></div></main><footer><button id="load">重新读取</button><button id="reset" disabled>恢复默认</button><button id="save" disabled>保存设置</button></footer><script>
/*__COMMON__*/
const api='https://api.weibo.cn/minis-enhanced-v2/config';
let cfg={},loaded=false,busy=false,dirty=false;
const $=s=>document.querySelector(s),widgets=()=>[...document.querySelectorAll('[data-k]')];
function msg(s,bad=false){$('#status').textContent=s;$('#status').dataset.bad=String(bad)}
function lock(){widgets().forEach(x=>x.disabled=!loaded||busy);document.querySelectorAll('[data-typed]').forEach(x=>x.disabled=!loaded||busy);$('#save').disabled=!loaded||busy;$('#reset').disabled=!loaded||busy;$('#load').disabled=busy}
const sections=new Map();function section(name){if(!sections.has(name)){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=name;d.append(s);$('#list').append(d);sections.set(name,d)}return sections.get(name)}
/*__UI_LABELS__*/
/*__UI_GROUPS__*/
function row(key,description,scope,custom=false,detail=''){const label=document.createElement('label');label.className='row';label.dataset.search=(key+' '+description+' '+scope).toLowerCase();const text=document.createElement('span'),strong=document.createElement('strong'),small=document.createElement('small'),input=document.createElement('input');strong.textContent=description;small.textContent=detail||('兼容原清理 · '+scope);small.title=key;const meta=document.createElement('small');meta.textContent='配置键：'+key;const dep=document.createElement('small');dep.className='dependency';text.append(strong,small,dep,meta);input.type='checkbox';input.dataset.k=key;input.dataset.custom=String(custom);input.disabled=true;input.setAttribute('aria-label',description);input.onchange=()=>{dirty=true;msg('有未保存的修改')};label.append(text,input);label.dataset.dependency=['enabled','injectSettingsEntry'].includes(key)?'':custom?('enabled,'+(routeDependency(scope)||'')):'enabled';editorBox(scope,key,custom&&!CUSTOM_FIELDS.find(f=>f.key===key&&f.kind==='explicit')).append(label)}
for(const k of Object.keys(LEGACY_DEFAULTS))row(k,legacyLabel(k),'legacy');
for(const f of CUSTOM_FIELDS)row(f.key,friendlyField(f),f.scope,true,fieldDependency(f)+' 字段：'+f.target+'；证据：'+f.evidence);
/*__TYPED_UI__*/
for(const [name,d]of purposeSections){const advanced=purposeAdvanced.get(name);advanced.hidden=!advanced.querySelector('.row');d.append(advanced);if(name==='共享外观与内容清理'){const note=document.createElement('p');note.textContent='共享作用范围：头像/卡片装饰影响首页、详情、评论及个人页多个响应；商品/热评清理还包含内部头像清理，关闭后两者均跳过；投票清理影响各信息流。各区源字段保留仍受这些共享总控影响。';d.insertBefore(note,d.firstChild.nextSibling)}}
function validateFull(c){validateConfig(c);if(Object.keys(c).length!==68||Object.keys(LEGACY_DEFAULTS).some(k=>typeof c[k]!=='boolean')||!plain(c.custom)||Object.keys(c.custom).length!==Object.keys(CUSTOM_DEFAULTS).length)throw Error('配置结构不完整，拒绝覆盖');return c}
function draw(){widgets().forEach(x=>x.checked=x.dataset.custom==='true'?cfg.custom[x.dataset.k]:cfg[x.dataset.k]);drawTyped();updateDependencies()}
async function request(options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(api,{...options,cache:'no-store',credentials:'omit',signal:controller.signal});let j;try{j=JSON.parse(await r.text())}catch(_){throw Error('响应不是JSON，请检查config重写')}if(!r.ok||!j.ok||j.schemaVersion!==3)throw Error(j.error||'服务版本不匹配');return validateFull(j.config)}finally{clearTimeout(timer)}}
async function load(){if(dirty&&!confirm('放弃未保存修改？'))return;busy=true;lock();try{cfg=await request();loaded=true;dirty=false;draw();msg('已连接 · '+(67+CUSTOM_FIELDS.length)+' 项布尔控制已读取')}catch(e){loaded=false;msg('读取失败：'+e.message,true)}finally{busy=false;lock()}}
async function save(next,text){try{validateFull(next);const bytes=byteLength(JSON.stringify(next));if(bytes>MAX_BYTES)throw Error('完整配置 '+bytes+' 字节，超过 32768 字节；请减少文字或排序项（尚未发送）')}catch(e){msg('不能保存：'+e.message,true);return}busy=true;lock();try{cfg=await request({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(next)});dirty=false;draw();msg(text)}catch(e){msg('保存失败：'+e.message+'；尚未确认生效',true)}finally{busy=false;lock()}}
$('#save').onclick=()=>{const next={custom:{}};for(const x of widgets())if(x.dataset.custom==='true')next.custom[x.dataset.k]=x.checked;else next[x.dataset.k]=x.checked;try{save(collectTyped(next),'已保存服务端确认的配置')}catch(e){msg('输入无效：'+e.message,true)}};$('#load').onclick=load;$('#reset').onclick=()=>{if(confirm('恢复全部默认并保存？'))save(normalize({}),'已恢复默认')};$('#search').oninput=()=>{const q=$('#search').value.trim().toLowerCase();for(const [name,d]of purposeSections){let count=0;d.querySelectorAll('.row').forEach(r=>{r.hidden=!!q&&!r.dataset.search.includes(q);if(!r.hidden)count++});d.hidden=count===0;if(q)d.open=count>0;const adv=purposeAdvanced.get(name);adv.hidden=![...adv.querySelectorAll('.row')].some(r=>!r.hidden);if(q)adv.open=!adv.hidden;for(const box of d.querySelectorAll('.typed-box')){box.hidden=![...box.querySelectorAll('.row')].some(r=>!r.hidden);if(q)box.open=!box.hidden}}};window.addEventListener('error',()=>msg('页面运行异常，请重新读取',true));lock();load();
</script></body></html>
